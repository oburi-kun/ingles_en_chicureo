<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inglés en Chicureo | Acompañándote en tu Certificación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #318ed2;
      --texto: #4a4a4a;
      --gris-oscuro: #444647;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Lato", Arial, sans-serif; color: var(--texto); background: #fff; }
    a { text-decoration: none; color: inherit; }

    .contenedor { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* Barra superior */
    .topbar { background: var(--azul); color: #fff; font-size: 16px; }
    .topbar .contenedor { display: flex; align-items: center; gap: 10px; height: 55px; }
    .topbar svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 1.8; }

    /* Cabecera */
    .cabecera .contenedor { display: flex; justify-content: space-between; align-items: flex-start; padding-top: 30px; padding-bottom: 45px; gap: 20px; flex-wrap: wrap; }
    .logo img { display: block; height: auto; width: 100%; max-width: 330px; }
    .logo h1 { font-family: "Roboto", Arial, sans-serif; font-size: 34px; line-height: 1.1; color: var(--texto); margin-top: 4px; }
    .logo p { font-size: 17px; color: #666; }
    .buscador { display: flex; align-items: center; width: 270px; margin-top: 10px; border-bottom: 1px solid #aaa; }
    .buscador input { flex: 1; border: 0; outline: 0; font: italic 17px Arial, sans-serif; padding: 8px 0; color: #555; background: transparent; }
    .buscador button { border: 0; background: none; cursor: pointer; padding: 4px; }
    .buscador svg { width: 20px; height: 20px; fill: none; stroke: #555; stroke-width: 2.5; }

    /* Menú */
    .menu { background: var(--azul); }
    .menu ul { list-style: none; display: flex; flex-wrap: wrap; gap: 0 48px; }
    .menu a { display: block; padding: 32px 0; color: #fff; font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: -.3px; }
    .menu a.activo { color: rgba(255,255,255,.6); }
    .menu a:hover { color: rgba(255,255,255,.7); }
    .menu .contenedor { padding-top: 0; padding-bottom: 0; }

    /* Banner */
    .banner { background: #fff; }
    .banner img { display: block; width: 100%; height: auto; }

    /* Frase */
    .frase { background: linear-gradient(rgba(40,42,43,.65), rgba(40,42,43,.65)), url("img/mochila.jpeg") center / cover no-repeat; color: #fff; text-align: center; padding: 140px 20px 160px; }
    .frase h2 { font-size: clamp(30px, 4vw, 54px); font-weight: 700; }

    @media (max-width: 800px) {
      .menu ul { gap: 0 24px; }
      .menu a { padding: 16px 0; font-size: 15px; }
      .frase { padding: 70px 20px 80px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="contenedor">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <a href="mailto:inglesenchicureo@yahoo.es">inglesenchicureo@yahoo.es</a>
    </div>
  </div>

  <header class="cabecera">
    <div class="contenedor">
      <a class="logo" href="index.html">
        <img src="img/cropped-banderas2.jpg" alt="Banderas de Reino Unido, Estados Unidos, Canadá y Unión Europea">
        <h1>Inglés en Chicureo</h1>
        <p>Acompañándote en tu Certificación</p>
      </a>
      <form class="buscador" role="search" onsubmit="return false">
        <input type="search" placeholder="Buscar …" aria-label="Buscar">
        <button type="submit" aria-label="Buscar">
          <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
        </button>
      </form>
    </div>
  </header>

  <nav class="menu" aria-label="Menú principal">
    <div class="contenedor">
      <ul>
        <li><a class="activo" href="index.html">Inicio</a></li>
        <li><a href="quienes-somos.html">Quiénes somos</a></li>
        <li><a href="examenes-y-certificaciones.html">Exámenes y certificaciones</a></li>
        <li><a href="deportistas-de-elite.html">Deportistas de élite</a></li>
        <li><a href="cursos-y-clases.html">Cursos y clases</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </div>
  </nav>

  <section class="banner">
    <img src="img/Banner Portada.png" alt="Grupo de personas sonriendo">
  </section>

  <section class="frase">
    <h2>Vive la experiencia de aprender Inglés</h2>
  </section>

</body>
</html>
